services:
  nozerodays.api:
    image: ${DOCKER_REGISTRY-}nozerodays.api
    build:
      context: .
      dockerfile: NoZeroDays.Api/Dockerfile
    ports:
      - 5248:8080
      - 7046:8081
    environment:
      - ConnectionStrings__DefaultConnection=Host=nozerodays.postgres;Port=5432;Database=zero_db;Username=postgres;Password=0000
      - ConnectionStrings__IdentityConnection=Host=nozerodays.postgres;Port=5432;Database=zero_db;Username=postgres;Password=0000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://nozerodays.aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      nozerodays.postgres:
        condition: service_healthy

  nozerodays.postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zero_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0000
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d zero_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  nozerodays.aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: true
    ports:
      - 18888:18888

volumes:
  postgres-data: